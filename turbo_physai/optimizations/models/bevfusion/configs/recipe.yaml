schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.bevfusion.base.hcu
  version: "1.0.0"
  description: Validated HCU optimization recipe for BEVFusion
model:
  name: BEVFusion
optimization_modules:
  - turbo_physai.optimizations.models.bevfusion.catalog
extends:
  - common.hcu.base
compatibility: {}
optimization_groups:
  - id: bevfusion.import_compatibility
    enabled: true
  - id: bevfusion.backbone
    enabled: true
  - id: bevfusion.loss_reduction
    enabled: true
  - id: bevfusion.training
    enabled: true
    options:
      channels_last: true
      cuda_prefetch: true
      compile_target: camera
      compile_mode: max-autotune-no-cudagraphs
      start_method: fork
  - id: bevfusion.gaussian
    enabled: true
  - id: bevfusion.depth_factorization
    enabled: true
  - id: bevfusion.bev_geometry
    enabled: true
  - id: bevfusion.hungarian_transfer
    enabled: true
  - id: bevfusion.transfusion_bbox_coder
    enabled: true
  - id: bevfusion.compile
    enabled: true
    options:
      mode: max-autotune-no-cudagraphs
