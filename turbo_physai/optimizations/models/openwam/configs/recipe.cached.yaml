schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.openwam.hcu.cached
  version: 0.1.0
  description: 'OpenWAM cached report combination: OPT-02 through 13; configure the
    cache directory'
model:
  name: OpenWAM
optimization_modules:
- turbo_physai.optimizations.models.openwam.catalog
compatibility:
  commits:
  - 0c9ed80d80af1d0c5f4148afe65cc7f462ec3995
optimization_groups:
- id: openwam.data
  options:
    vae_latent_cache: true
    vae_latent_cache_dir: /path/to/openwam-cache
- id: openwam.compute
  options:
    lightop_norm: true
    linear_bias2d: true
- id: openwam.architecture
  options:
    constant_cache: true
- id: openwam.mot
  options:
    sac_attention: false
    sac_ffn_full: true
    sac_gemm: false
    sac_layers: null
    sac_extra_ops: ''
- id: openwam.text
  options:
    text_cache_dir: null
    padding_plan_cpu: true
    fa2_padding: true
    fa2_mask_fused: true
- id: openwam.training
  options:
    zero_overlap: true
    zero_reduce_scatter: true
    online_encode: true
    deferred_gather: true
    fused_adamw: true
    host_async: true
    hw_queues: 16
    zero_scaled_pack: false
    zero_norm_overlap: false
