# Replace vae_latent_cache_dir before generating an OptimizationConfig.
# T5 files use the text/ subdirectory; keep the same path for build and training.
schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.openwam.hcu.cached
  version: 0.1.0
  description: 'OpenWAM cached report combination: OPT-02 through 13; configure the
    cache directory'
model:
  name: OpenWAM
optimization_modules:
- turbo_physai.optimizations.models.openwam.catalog
compatibility:
  commits:
  - 1204dde1b9e9c232131fc99a3f2c6b78330e7f64
optimization_groups:
- id: openwam.data
  options:
    uint8_preprocess: true
    vae_latent_cache: true
    vae_latent_cache_dir: /path/to/openwam-cache
- id: openwam.compute
  options:
    pointwise_compile: true
    rope_real: true
    lightop_norm: true
    linear_bias2d: true
- id: openwam.architecture
  options:
    constant_cache: true
- id: openwam.mot
  options:
    mot_split_attn: true
    compile_mot: true
    checkpoint_skip_layers: 24
    sac_attention: false
    sac_ffn_full: true
    sac_gemm: false
    sac_layers: null
    sac_extra_ops: ''
    checkpoint_stats: false
- id: openwam.text
  options:
    text_cache: true
    text_cache_size: 32
    text_cache_dir: null
    t5_prefix: true
    text_trim: true
    padding_plan_cpu: true
    fa2_padding: true
    fa2_mask_fused: true
- id: openwam.vae
  options:
    vae_channels_last: true
    vae_pointwise_compile: true
    compile_vae: true
- id: openwam.training
  options:
    zero_overlap: true
    zero_reduce_scatter: true
    online_encode: true
    deferred_gather: true
    fused_adamw: true
    host_async: true
    hw_queues: 16
    profiling: 'off'
    profile_light: false
    trace_gc: false
