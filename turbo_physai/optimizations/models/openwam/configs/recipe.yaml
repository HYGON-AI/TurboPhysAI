schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.openwam.hcu
  version: 0.1.0
  description: OpenWAM main training optimizations through runtime monkey patches
model:
  name: OpenWAM
optimization_modules:
- turbo_physai.optimizations.models.openwam.catalog
compatibility:
  commits:
  - 1204dde1b9e9c232131fc99a3f2c6b78330e7f64
optimization_groups:
- id: openwam.data
  options:
    uint8_preprocess: true
    vae_latent_cache: false
    vae_latent_cache_dir: null
- id: openwam.compute
  options:
    pointwise_compile: false
    rope_real: true
    lightop_norm: false
    linear_bias2d: false
- id: openwam.architecture
  options:
    constant_cache: true
- id: openwam.mot
  options:
    mot_split_attn: true
    compile_mot: false
    checkpoint_skip_layers: 0
    sac_attention: false
    sac_ffn_full: false
    sac_gemm: false
    sac_layers: null
    sac_extra_ops: ''
- id: openwam.text
  options:
    text_cache: true
    text_cache_size: 32
    text_cache_dir: null
    t5_prefix: true
    text_trim: true
    padding_plan_cpu: true
    fa2_padding: true
    fa2_mask_fused: false
- id: openwam.vae
  options:
    vae_channels_last: true
    vae_pointwise_compile: false
    compile_vae: false
- id: openwam.training
  options:
    zero_overlap: true
    zero_reduce_scatter: false
    online_encode: false
    deferred_gather: false
    fused_adamw: false
    host_async: false
    hw_queues: 0
    zero_scaled_pack: false
    zero_norm_overlap: false
