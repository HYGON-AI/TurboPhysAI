# Online reference script settings; preserve the existing hardware queue count.
schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig
environment:
  set:
    TORCH_BLAS_PREFER_HIPBLASLT: '1'
    HIPBLASLT_ALLOW_TF32: '1'
    HSA_FORCE_FINE_GRAIN_PCIE: '1'
    TORCHINDUCTOR_COMPILE_THREADS: '1'
    TORCHINDUCTOR_COORDINATE_DESCENT_TUNING: '0'
    WANDB_MODE: offline
    HYDRA_FULL_ERROR: '1'
    OPENWAM_TEXT_CACHE: '1'
    OPENWAM_TEXT_MISS_FAST: '1'
    OPENWAM_FAST_INPUT: '1'
    OPENWAM_FUSED_ROPE: '1'
    OPENWAM_MIXED_ATTN_CKPT: '0'
    OPENWAM_VAE_FULLCLIP: '1'
    OPENWAM_COMPILE_VAE: '1'
    OPENWAM_VAE_CL: '1'
    OPENWAM_CONTEXT_TRUNC: '1'
    OPENWAM_COMPILE_BLOCKS: '1'
    OPENWAM_DS_TIMER_NOSYNC: '1'
    OPENWAM_DS_OVERLAP_COMM: '1'
    OPENWAM_FAST_CAT: '1'
    OPENWAM_GC_FREEZE: '1'
    OPENWAM_SDPA_CUDNN: '0'
    PYTORCH_MIOPEN_SUGGEST_NHWC: '1'
    PYTORCH_MIOPEN_SUGGEST_NDHWC: '1'
  unset:
  - TORCH_LOGS
  - TORCHDYNAMO_VERBOSE
  - ROCBLAS_TENSILE_LIBPATH
  - ROCBLAS_LAYER
  - ROCBLAS_LOG_BENCH_PATH
  - ROCBLAS_LOG_TRACE_PATH
  - ROCBLAS_LOG_PROFILE_PATH
process:
  numa: false
