schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig

metadata:
  id: model.openpi.turbo
  version: "1.0.0"
  description: OpenPI HCU optimization recipe for generating the validated config

model:
  name: openpi

optimization_modules:
  - turbo_physai.optimizations.models.openpi.catalog

# Do not extend common.hcu.base: its MMCV/3D detection groups are unrelated to OpenPI.
compatibility: {}

# Keep optimization defaults in the replacements; expose only the compile mode.
optimization_groups:
  - id: openpi.network
    enabled: true

  - id: openpi.compile_stack
    enabled: true
    options:
      mode: max-autotune-no-cudagraphs

  - id: openpi.gemma_checkpoint_stride
    enabled: true

  - id: openpi.fused_adamw
    enabled: true

  - id: openpi.disable_tqdm
    enabled: true

  - id: openpi.inductor_settings
    enabled: true

  - id: openpi.kernel_runtime
    enabled: true

  - id: openpi.clip_grad_scale
    enabled: true
