schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

environment:
  set:
    HIP_BUFFER_EXTRA_SIZE: "0"
    PYTHONPATH: "../TurboPhysAI:../TurboPhysAI/turbo_physai/optimizations/models/openpi/compat:.:./src:./packages/openpi-client/src"
    OPENPI_DATA_HOME: "/dev/shm/openpi_8gpu_cache/openpi_data"
    HF_LEROBOT_HOME: "/workspace/openpi_TurboPhysAI/static_data/.lerobot_root"
    HF_DATASETS_CACHE: "/dev/shm/openpi_8gpu_cache/hf_datasets"
    TORCHINDUCTOR_CACHE_DIR: "/dev/shm/openpi_8gpu_cache/inductor"
    TRITON_CACHE_DIR: "/dev/shm/openpi_8gpu_cache/triton"
    LD_LIBRARY_PATH: "/opt/openpi/dtk-26.04-blas/lib:/usr/local/lib/:/usr/local/lib64/:/opt/mpi/lib:/opt/hwloc/lib:/opt/ucx/lib:/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib"
    ROCBLAS_TENSILE_LIBPATH: "/opt/openpi/dtk-26.04-blas/lib/rocblas/library_gpu6"
    HIPBLASLT_ALLOW_TF32: "0"
    HSA_FORCE_FINE_GRAIN_PCIE: "1"
    JAX_PLATFORMS: "cpu"
    PYTHONHASHSEED: "0"
    PYTHONUNBUFFERED: "1"
    PYTORCH_MIOPEN_SUGGEST_NHWC: "1"
    TORCHINDUCTOR_ALIGNMENT_ASSERTS: "0"
    TORCHINDUCTOR_EMULATE_PRECISION_CASTS: "0"
    TORCH_NCCL_ENABLE_MONITORING: "0"
    WANDB_DISABLED: "true"
    WANDB_MODE: "disabled"
    HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NCCL_DEBUG: "WARN"
  unset:
    - OPENPI_TURBO_NUMA_PREBOUND

process:
  numa: false
