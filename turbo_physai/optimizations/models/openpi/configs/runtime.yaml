schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

environment:
  set:
    HIP_BUFFER_EXTRA_SIZE: "0"
    HF_DATASETS_CACHE: "/dev/shm/openpi_8gpu_cache/hf_datasets"
    TORCHINDUCTOR_CACHE_DIR: "/dev/shm/openpi_8gpu_cache/inductor"
    TRITON_CACHE_DIR: "/dev/shm/openpi_8gpu_cache/triton"
    HIPBLASLT_ALLOW_TF32: "0"
    HSA_FORCE_FINE_GRAIN_PCIE: "1"
    JAX_PLATFORMS: "cpu"
    PYTHONHASHSEED: "0"
    PYTHONUNBUFFERED: "1"
    PYTORCH_MIOPEN_SUGGEST_NHWC: "1"
    TORCHINDUCTOR_ALIGNMENT_ASSERTS: "0"
    TORCHINDUCTOR_EMULATE_PRECISION_CASTS: "0"
    TORCH_NCCL_ENABLE_MONITORING: "0"
    NCCL_DEBUG: "WARN"

process:
  numa: true
