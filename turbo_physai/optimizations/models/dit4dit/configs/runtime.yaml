schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

# Tuned BLAS/MIOpen libraries and caches are supplied by the delivery image,
# not by TurboPhysAI. Keep only portable process/runtime settings here.
environment:
  set:
    TOKENIZERS_PARALLELISM: "false"
  unset: []

process:
  numa: auto
