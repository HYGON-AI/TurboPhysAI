schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

# MIOpen caches are generated at runtime in the persistent path selected in
# the model README. Custom BLAS/Tensile artifacts are not part of this recipe;
# keep only portable process/runtime settings here.
environment:
  set:
    TOKENIZERS_PARALLELISM: "false"
  unset: []

process:
  numa: auto
