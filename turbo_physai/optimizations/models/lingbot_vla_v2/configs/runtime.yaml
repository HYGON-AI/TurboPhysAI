schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

environment:
  set:
    GPU_MAX_HW_QUEUES: "16"
    HIP_BUFFER_EXTRA_SIZE: "0"
    TRITON_F32_DEFAULT: "tf32"
    TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
    TORCH_COMPILE_CACHE_KEY_TAG: "flex-attn-tf32"
    MIOPEN_FIND_ENFORCE: "SEARCH"
  unset: []

# Not set here on purpose: ROCBLAS_TENSILE_LIBPATH.  The rocBLAS tuning library
# is generated per node by `rocblas-tensile` for that node's device and driver,
# so it cannot ship as a packaged default.  Deployers who have tuned a noderrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
# override it on the command line:
#   turbo-physai run --set ROCBLAS_TENSILE_LIBPATH=<tuned library directory> ...

process:
  numa: true
