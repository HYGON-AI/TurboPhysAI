name: Release WHL HCU PyPI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: read

# Share the physical HCU with the existing hcu-ci.yml workflow.
concurrency:
  group: turbophysai-hcu-single-device
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Publish HCU wheel
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, nmz1]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match docker/ci/Dockerfile's supplied Torch 2.10 framework.
          - harbor_site: 10.16.1.152:5000
            dtk_version: "26.04"
            dtk_tag: "2604"
            py_version: "3.10"
            torch_version: 2.10.0+das.opt1.dtk2604.2608131652.g28498c
            torchvision_version: 0.25.0+das185.dtk2604.torch2100.2608130858.gdcd044
            triton_version: 3.6.0+das185.dtk2604.torch2100.2608131719.gb796b1
            flash_attn_version: 2.8.4+dtk2604.torch2100.2609231125.g11f180
            apex_version: 1.7.0+dtk2604.torch2100.2609201739.g9783d4
            torchaudio_version: 2.10.0+das.opt1.dtk2604.torch2100.2609021532.gdf6f74
            lightop_url: "https://pypi.sourcefind.cn/das_release/das1.8.5/+f/4a3/1521919e4c764/lightop-0.6.0+das.dtk2604.torch2100.2608121706.g09a4f3-cp310-cp310-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl#sha256=4a31521919e4c76405e8dcb5035b55cdc92b2ad6dc5e9f2e72373510835df159"
            hipdnn_url: "https://hygon-thpcbench-1251001002.cos.ap-shanghai.myqcloud.com/hygon/whl/hipdnn-1.0.1+dtk2604-cp310-cp310-linux_x86_64.whl#sha256=57d0e61cb381bbb244f45140b0dac9775bfc47e33c0eef2acc87627b1b8ea8ec"
    defaults:
      run:
        shell: bash
    container:
      # Reuse the DTK already installed in the same base as the test CI.
      image: ${{ matrix.harbor_site }}/hcu/base/dtk:${{ matrix.dtk_version }}-ubuntu22.04-py${{ matrix.py_version }}
      options: >-
        --user root
        --device=/dev/kfd --device=/dev/dri
        --group-add=video
        -v /opt/hyhal:/opt/hyhal:ro
        --shm-size=64g
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged
        --ulimit stack=-1:-1
        --ulimit memlock=-1:-1
    env:
      HIP_VISIBLE_DEVICES: "0"
      MAX_JOBS: "4"
      LANG: C.UTF-8
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TORCH_CUDA_ARCH_LIST: "9.0"
      PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
      PIP_TRUSTED_HOST: ${{ vars.HCU_PIP_TRUSTED_HOST || 'pypi.tuna.tsinghua.edu.cn' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DEFAULT_TIMEOUT: "180"
      PIP_RETRIES: "10"
      PYPI_URL: http://12.12.12.201:9929
      PYPI_TRUSTED_HOST: "12.12.12.201"
      DTK_PYPI_INDEX: https://pypi.sourcefind.cn/nightly/dtk${{ matrix.dtk_tag }}
      DTK_LLVM_URL: http://42.228.13.241:18000/ai_cc/Nightly/dtk_llvm-1.0.0%2Bdtk2604.2609201512.gf72f9e-x86_64.run
      TORCH_VERSION: ${{ matrix.torch_version }}
      TORCHVISION_VERSION: ${{ matrix.torchvision_version }}
      TRITON_VERSION: ${{ matrix.triton_version }}
      FLASH_ATTN_VERSION: ${{ matrix.flash_attn_version }}
      APEX_VERSION: ${{ matrix.apex_version }}
      TORCHAUDIO_VERSION: ${{ matrix.torchaudio_version }}
      LIGHTOP_WHL_URL: ${{ matrix.lightop_url }}
      HIPDNN_WHL_URL: ${{ matrix.hipdnn_url }}

    steps:
      - name: Install original CI system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Same Ubuntu/Debian DTK base-image assumption as docker/ci/Dockerfile.
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libnuma-dev \
            ninja-build python3-dev python3-tk
          rm -rf /var/lib/apt/lists/*

      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure existing DTK and install compiler
        run: |
          set -eo pipefail
          # The base image already supplies DTK and its runtime libraries.
          test -f /opt/dtk/env.sh
          if [[ ! -e /opt/hyhal && -d /opt/dtk/.hyhal ]]; then
            cp -a /opt/dtk/.hyhal /opt/hyhal
          fi
          printf '%s\n' /opt/dtk/.hyhal/rocm_smi/lib /opt/dtk/.hyhal/lib \
            > /etc/ld.so.conf.d/hcu-framework.conf
          ldconfig
          export ROCM_PATH=/opt/dtk DTKROOT=/opt/dtk HIP_PATH=/opt/dtk/hip
          export HYHAL_PATH=/opt/hyhal MIOPEN_FIND_MODE=3
          export AMDGPU_TARGETS='gfx906;gfx926;gfx928;gfx936;gfx938'
          export CMAKE_PREFIX_PATH="/opt/hyhal:${CMAKE_PREFIX_PATH:-}"
          export PATH="/opt/dtk/bin:/opt/dtk/llvm/bin:/opt/dtk/hip/bin:/opt/dtk/hip/bin/hipify:/opt/hyhal/bin:/opt/dtk/opencl/bin:${PATH}"
          export LD_LIBRARY_PATH="/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib:${LD_LIBRARY_PATH:-}"
          export LIBRARY_PATH="/opt/hyhal/lib:/opt/dtk/opencl/lib:/opt/dtk/dushmem/lib:${LIBRARY_PATH:-}"
          export C_INCLUDE_PATH="/opt/dtk/dcc/gcvm/include:/opt/dtk/include:/opt/hyhal/include:/opt/dtk/llvm/include:/opt/dtk/opencl/include:${C_INCLUDE_PATH:-}"
          export CPLUS_INCLUDE_PATH="/opt/dtk/dcc/gcvm/include:/opt/dtk/include:/opt/hyhal/include:/opt/dtk/llvm/include:/opt/dtk/dushmem/include:/opt/dtk/opencl/include:${CPLUS_INCLUDE_PATH:-}"
          source /opt/dtk/env.sh
          curl -fsSL "${DTK_LLVM_URL}" -o /tmp/magi-dtk-llvm.run
          # The installer may stop reading yes early; retain its exit status.
          (set +o pipefail; yes | bash /tmp/magi-dtk-llvm.run)
          rm -f /tmp/magi-dtk-llvm.run
          for key in ROCM_PATH DTKROOT HIP_PATH HYHAL_PATH MIOPEN_FIND_MODE \
              AMDGPU_TARGETS CMAKE_PREFIX_PATH LD_LIBRARY_PATH LIBRARY_PATH \
              C_INCLUDE_PATH CPLUS_INCLUDE_PATH; do
            printf '%s=%s\n' "${key}" "${!key}" >> "${GITHUB_ENV}"
          done
          printf '%s\n' "${PATH//:/$'\n'}" >> "${GITHUB_PATH}"

      - name: Install original CI Python dependencies and release tools
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          set -u
          # Preserve docker/ci/Dockerfile's full dependency setup.
          # Installing test dependencies does not execute the test suite.
          python3 -m pip config set global.index-url "${PIP_INDEX_URL}"
          python3 -m pip config set global.trusted-host "${PIP_TRUSTED_HOST}"
          python3 -m pip install --upgrade "setuptools==80.9.0" wheel "pip<26"
          export LD_LIBRARY_PATH="/opt/dtk/.hyhal/rocm_smi/lib:${LD_LIBRARY_PATH:-}"
          /usr/bin/python3 -m pip install --no-cache-dir \
            cmake==3.29.2 \
            "torch==${TORCH_VERSION}" \
            "torchvision==${TORCHVISION_VERSION}" \
            "triton==${TRITON_VERSION}" \
            "flash-attn==${FLASH_ATTN_VERSION}" \
            "apex==${APEX_VERSION}" \
            "torchaudio==${TORCHAUDIO_VERSION}" \
            --index-url "${DTK_PYPI_INDEX}"
          /usr/bin/python3 -m pip install --no-deps "${LIGHTOP_WHL_URL}" "${HIPDNN_WHL_URL}"
          /usr/bin/python3 -m pip install \
            pytest coverage "numpy==1.23.5" "scipy>=1.9.0" PyYAML packaging \
            "Pillow==12.3.0"
          # Preserve the dependency installation done before the wheel build in
          # run_hcu_ci.sh, including its coverage pin. Do not run that script.
          python3 -m pip install -r requirements-test.txt
          # ciupload is hosted on the internal DTK nightly index.
          python3 -m pip install --no-cache-dir \
            --index-url "${PYPI_URL}/nightly/dtk${{ matrix.dtk_tag }}/+simple/" \
            --trusted-host "${PYPI_TRUSTED_HOST}" \
            ciupload
          torch_lib="$(python3 -c 'import torch; from pathlib import Path; print(Path(torch.__file__).parent / "lib")')"
          echo "LD_LIBRARY_PATH=${torch_lib}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Check build environment versions
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          python3 - <<'PY'
          import os
          import sys
          from importlib.metadata import version
          import torch, torchvision, triton
          for name, module in (("torch", torch), ("torchvision", torchvision), ("triton", triton)):
              # The DAS Triton module reports 3.5.0; use wheel metadata.
              actual = version(name) if name == "triton" else module.__version__
              expected = os.environ[f"{name.upper()}_VERSION"]
              assert actual.split("+", 1)[0] == expected.split("+", 1)[0], (name, actual, expected)
              print(f"{name}: {actual}")
          print("Triton module version:", triton.__version__)
          assert sys.version_info[:2] == (3, 10), sys.version
          assert torch.version.hip, "HIP Torch is required"
          PY

      - name: Build wheel
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          set -u
          export ROCM_HOME="${ROCM_HOME:-${ROCM_PATH:-/opt/dtk}}"
          unset PYTHONPATH
          repo_root="$(pwd)"
          build_root="$(mktemp -d /tmp/turbophysai-build.XXXXXX)"
          trap 'rm -rf -- "${build_root}"' EXIT
          # Reuse run_hcu_ci.sh's isolated-source wheel build, without tests.
          cp -a "${repo_root}/." "${build_root}/"
          git config --global --add safe.directory "${build_root}"
          mkdir -p "${repo_root}/dist"
          python3 -m pip wheel \
            --no-build-isolation --no-deps \
            --wheel-dir "${repo_root}/dist" "${build_root}"

      - name: Select raw HCU wheel
        run: |
          set -eo pipefail
          set -u
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'turbo_physai-*.whl' -print)
          [[ "${#wheels[@]}" -eq 1 ]] || { echo 'Expected exactly one raw wheel' >&2; exit 1; }
          echo "Using HCU-specific Linux wheel: ${wheels[0]}"

      - name: CIUpload NIGHTLY
        if: ${{ github.event_name == 'push' }}
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${PYPI_URL:?PYPI_URL is not configured}"
          : "${PYPI_PASSWORD:?Configure repository secret PYPI_PASSWORD}"
          dtk_version="$(tr -d '.[:space:]' < /opt/dtk/.info/rocm_version)"
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'turbo_physai-*.whl' -print)
          [[ "${#wheels[@]}" -eq 1 ]] || { echo 'Expected exactly one raw HCU Linux wheel' >&2; exit 1; }
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" --password "${PYPI_PASSWORD}" \
            --dtk_version "${dtk_version}" -f "${wheels[0]}" --record

      - name: Clean generated wheel directories
        if: always()
        run: |
          # Only generated workspace files; the runner manages container cleanup.
          cd "${GITHUB_WORKSPACE}"
          rm -rf -- dist output
