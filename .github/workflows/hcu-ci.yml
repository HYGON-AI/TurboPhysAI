name: TurboPhysAI HCU CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same PR; different refs use separate ARC resources.
concurrency:
  group: turbophysai-hcu-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel-build:
    name: Build HCU wheel
    # Never execute an untrusted fork directly on an internal self-hosted
    # runner. A maintainer can approve it by moving the commit to a trusted
    # branch and starting workflow_dispatch from that branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: hygon-build
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      # Set HCU_CI_BASE_IMAGE to an approved image@sha256:digest when available.
      image: ${{ vars.HCU_CI_BASE_IMAGE || '10.16.1.152:5000/hcu/base/dtk:26.04-ubuntu22.04-py3.10' }}
    env:
      TURBOPHYSAI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
      PIP_TRUSTED_HOST: ${{ vars.HCU_PIP_TRUSTED_HOST || 'pypi.tuna.tsinghua.edu.cn' }}
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      TORCH_CUDA_ARCH_LIST: "9.0"

    steps:
      - name: Install CI system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libnuma-dev \
            ninja-build python3-dev python3-tk
          rm -rf /var/lib/apt/lists/*

      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare artifact directory
        run: |
          set -euo pipefail
          artifact_dir="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/build"
          mkdir -p "${artifact_dir}"
          echo "TURBOPHYSAI_CI_ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          echo "CI artifacts: ${artifact_dir}"

      - name: Prepare HCU build environment
        run: |
          set -euo pipefail
          bash .github/scripts/setup_hcu_environment.sh 2>&1 | tee "${TURBOPHYSAI_CI_ARTIFACT_DIR}/setup.log"

      - name: Build wheel without an HCU
        run: bash .github/scripts/run_hcu_ci.sh --build-only

      - name: Upload wheel for the test job
        uses: actions/upload-artifact@v4
        with:
          name: hcu-wheel-${{ github.run_id }}
          path: ${{ env.TURBOPHYSAI_CI_ARTIFACT_DIR }}/dist/*.whl
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload CI artifacts
        if: ${{ always() && env.TURBOPHYSAI_CI_ARTIFACT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hcu-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TURBOPHYSAI_CI_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 7

  wheel-and-tests:
    needs: wheel-build
    name: Test HCU wheel
    # Never execute an untrusted fork directly on an internal self-hosted
    # runner. A maintainer can approve it by moving the commit to a trusted
    # branch and starting workflow_dispatch from that branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: hygon-bw1100-1card
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      # Set HCU_CI_BASE_IMAGE to an approved image@sha256:digest when available.
      image: ${{ vars.HCU_CI_BASE_IMAGE || '10.16.1.152:5000/hcu/base/dtk:26.04-ubuntu22.04-py3.10' }}
    env:
      TURBOPHYSAI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
      PIP_TRUSTED_HOST: ${{ vars.HCU_PIP_TRUSTED_HOST || 'pypi.tuna.tsinghua.edu.cn' }}
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      TORCH_CUDA_ARCH_LIST: "9.0"

    steps:
      - name: Install CI system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libnuma-dev \
            ninja-build python3-dev python3-tk
          rm -rf /var/lib/apt/lists/*

      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare artifact directory
        run: |
          set -euo pipefail
          artifact_dir="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/tests"
          mkdir -p "${artifact_dir}"
          echo "TURBOPHYSAI_CI_ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          echo "CI artifacts: ${artifact_dir}"

      - name: Download the wheel from the build job
        uses: actions/download-artifact@v4
        with:
          name: hcu-wheel-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-wheel

      - name: Prepare HCU test environment
        run: |
          set -euo pipefail
          bash .github/scripts/setup_hcu_environment.sh 2>&1 | tee "${TURBOPHYSAI_CI_ARTIFACT_DIR}/setup.log"

      - name: Install, import-check, and test the built wheel
        run: bash .github/scripts/run_hcu_ci.sh --test-only "${GITHUB_WORKSPACE}/ci-wheel"

      - name: Report CI results
        if: always()
        run: |
          summary="${TURBOPHYSAI_CI_ARTIFACT_DIR:-}/coverage/summary.md"
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload CI artifacts
        if: ${{ always() && env.TURBOPHYSAI_CI_ARTIFACT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hcu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TURBOPHYSAI_CI_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 7
