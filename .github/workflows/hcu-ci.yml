name: TurboPhysAI HCU CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The HCU runner and its Docker daemon share a physical device. Serialize all
# executions, including executions from different branches and event types.
concurrency:
  group: turbophysai-hcu-single-device
  cancel-in-progress: false

env:
  # Transitional mode: build the repository-owned CI image on each runner.
  # Keep a stable local tag so persistent runners can reuse Docker layer cache.
  TURBOPHYSAI_CI_IMAGE: turbophysai-ci:hcu-ci-local

jobs:
  wheel-and-tests:
    name: Build wheel and run the complete single-HCU suite
    # Never execute an untrusted fork directly on an internal self-hosted
    # runner. A maintainer can approve it by moving the commit to a trusted
    # branch and starting workflow_dispatch from that branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 120
    env:
      HIP_VISIBLE_DEVICES: "0"
      MAX_JOBS: "4"
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL }}
      PIP_TRUSTED_HOST: ${{ vars.HCU_PIP_TRUSTED_HOST }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/turbophysai-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${artifact_dir}"
          echo "TURBOPHYSAI_CI_ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          echo "TURBOPHYSAI_CI_CONTAINER=turbophysai-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "TURBOPHYSAI_DOCKER_CONFIG=${RUNNER_TEMP}/turbophysai-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Validate HCU runner and Docker
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kfd
          test -e /dev/dri
          test -d /opt/hyhal
          docker version

      - name: Authenticate to Harbor for the base image when credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HARBOR_USERNAME:-}" && -z "${HARBOR_PASSWORD:-}" ]] || \
             [[ -z "${HARBOR_USERNAME:-}" && -n "${HARBOR_PASSWORD:-}" ]]; then
            echo "HARBOR_USERNAME and HARBOR_PASSWORD must be configured together." >&2
            exit 1
          elif [[ -n "${HARBOR_USERNAME:-}" ]]; then
            mkdir -p "${TURBOPHYSAI_DOCKER_CONFIG}"
            chmod 700 "${TURBOPHYSAI_DOCKER_CONFIG}"
            export DOCKER_CONFIG="${TURBOPHYSAI_DOCKER_CONFIG}"
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
            printf '%s' "${HARBOR_PASSWORD}" | docker login \
              harbor.sourcefind.cn:5443 \
              --username "${HARBOR_USERNAME}" \
              --password-stdin
          else
            echo "Harbor secrets are not configured; using the runner's existing Docker credentials."
          fi

      - name: Build the repository-specified CI image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file docker/ci/Dockerfile \
            --tag "${TURBOPHYSAI_CI_IMAGE}" \
            .
          docker image inspect "${TURBOPHYSAI_CI_IMAGE}" \
            --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}' | \
            tee "${TURBOPHYSAI_CI_ARTIFACT_DIR}/image-metadata.txt"

      - name: Build, install, import-check, and test in the HCU container
        shell: bash
        run: |
          set -euo pipefail

          device_args=(--device=/dev/kfd --device=/dev/dri)
          if [[ -e /dev/mkfd ]]; then
            device_args+=(--device=/dev/mkfd)
          fi

          pip_args=()
          if [[ -n "${PIP_INDEX_URL:-}" ]]; then
            pip_args+=(-e PIP_INDEX_URL)
          fi
          if [[ -n "${PIP_TRUSTED_HOST:-}" ]]; then
            pip_args+=(-e PIP_TRUSTED_HOST)
          fi

          docker run --rm \
            --name "${TURBOPHYSAI_CI_CONTAINER}" \
            --privileged \
            --network=host \
            --ipc=host \
            --shm-size=64g \
            --group-add=video \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --ulimit stack=-1:-1 \
            --ulimit memlock=-1:-1 \
            --user root \
            "${device_args[@]}" \
            "${pip_args[@]}" \
            -e CI=true \
            -e GITHUB_SHA \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -e HIP_VISIBLE_DEVICES \
            -e MAX_JOBS \
            -e TURBOPHYSAI_HOST_UID="$(id -u)" \
            -e TURBOPHYSAI_HOST_GID="$(id -g)" \
            -e TURBOPHYSAI_CI_IMAGE \
            -e TURBOPHYSAI_CI_ARTIFACT_DIR \
            -v /opt/hyhal:/opt/hyhal:ro \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${TURBOPHYSAI_CI_ARTIFACT_DIR}:${TURBOPHYSAI_CI_ARTIFACT_DIR}" \
            -w "${GITHUB_WORKSPACE}" \
            "${TURBOPHYSAI_CI_IMAGE}" \
            bash .github/scripts/run_hcu_ci.sh

      - name: Remove an interrupted test container
        if: always()
        shell: bash
        run: |
          docker rm -f "${TURBOPHYSAI_CI_CONTAINER}" >/dev/null 2>&1 || true
          if [[ -n "${TURBOPHYSAI_DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "${TURBOPHYSAI_DOCKER_CONFIG}"
          fi

      - name: Upload wheel and complete CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbophysai-hcu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/turbophysai-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
